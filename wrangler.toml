name = "worker-cms-plugin-form"
main = "src/index.ts"
compatibility_date = "2026-07-14"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

# Admin view templates (LiquidJS + JSON templates, mirroring the CMS). The
# Worker runs first for every request and reads these internally via the VIEWS
# binding, so the files are never served publicly.
[assets]
directory = "./views"
binding = "VIEWS"
run_worker_first = true

[version_metadata]
binding = "CF_VERSION_METADATA"

# The CMS forwards this secret on every hook / admin call, and this plugin
# sends it back on every Plugin API write-back call. Set it to THIS plugin's
# dedicated secret — shown in the CMS admin under Plugins → form → Edit →
# Shared secret:
#   wrangler secret put PLUGIN_SECRET

# ── Multi-tenant mode (several CMS hosts → this one plugin) ────────────────────
# The CMS can enroll and revoke itself through the SDK's auto-tenant protocol.
# TENANT_ENROLL_ORIGINS may optionally restrict enrollment to a comma-separated
# allowlist of canonical CMS origins. CMS_URL/PLUGIN_SECRET remain a local and
# legacy single-tenant fallback.
[[kv_namespaces]]
binding = "TENANTS"
id = "ed24dc375293421ebf5cbc937308ecfa"

# ── Attachments (read side) ───────────────────────────────────────────────────
# The SAME bucket worker-form writes file-upload answers to. Bind it to let the
# admin download an attachment through
# /admin/plugins/form/forms/<id>/files/<key> — the only path to one; files are
# never served publicly. Leave unbound and file answers show as plain text:
#   wrangler r2 bucket create cms-form-uploads
# [[r2_buckets]]
# binding = "UPLOADS"
# bucket_name = "cms-form-uploads"

[vars]
# Base URL of the CMS Worker — where this plugin reaches the Plugin API
# ({CMS_URL}/__cms/*, page read/write). In multi-tenant mode, per-tenant cmsUrl
# comes from the TENANTS record instead.
CMS_URL = "http://localhost:8787"
# Origin of worker-form, the separate Worker that serves /f/<slug> to visitors.
# Shown as the shareable form link in the admin dashboard.
# PUBLIC_BASE_URL = "https://forms.example.com"
